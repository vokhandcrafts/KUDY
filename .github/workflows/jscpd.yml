name: jscpd
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  jscpd:
    # Self-contained copy of the company jscpd gate. The reusable workflow in
    # vokhandcrafts/ai-company-infrastructure cannot be called from here: both
    # repositories are private and user-owned, and GitHub rejects cross-repo
    # reusable-workflow calls between private user-account repositories at
    # startup with zero jobs ("workflow file issue", issue #241 — runs
    # 36047891013, 36583038462, 36587670194; the same-repo control call
    # succeeds). Gate logic mirrors standards/jscpd/run.sh there; keep the two
    # in sync in the same commit. Guarded in tools/ci/check-required-checks.mjs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Detect duplicated code
        shell: bash
        env:
          INPUT_PATH: "."
        run: |
          set -euo pipefail

          COMPANY_CONFIG=$(mktemp /tmp/company-jscpd.XXXXXX.json)
          # Company default (ai-company-infrastructure standards/jscpd/.jscpd.json),
          # base64-embedded: a cross-repo caller cannot read that repository's
          # files at runtime. Regenerate with base64 -w0 on the source file.
          echo '' | base64 -d > "$COMPANY_CONFIG"

          SCAN_PATH="${INPUT_PATH:-.}"
          CONFIG=""
          if [[ -f .jscpd.json ]]; then
            CONFIG=".jscpd.json"
          fi
          if [[ ! -f "$CONFIG" ]]; then
            CONFIG="$COMPANY_CONFIG"
          fi

          cmd=(npx --yes jscpd@5.1.2 --config "$CONFIG" --no-tips)
          read -r -a paths <<< "$SCAN_PATH"
          cmd+=("${paths[@]}")

          printf '+'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          exec "${cmd[@]}"
