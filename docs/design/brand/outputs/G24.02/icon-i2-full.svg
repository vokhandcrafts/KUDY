<!--
  icon-i2-full.svg — G24.02 (#693), кандыдат «Поўны сілуэт з крыламі»
  (напрамак I2 з рэпорта; брыф: крылы таксама дапамагаюць пазнаваць фігурку).
  Анфас, сімэтрычныя крылы, хвост закручаны улева — склад рэфэрэнсу B2, спрошчаны
  да плоскага сілуэту. Скіца для параўнання і выбару ўладара, НЕ production-асет.
  Палітра — канон: крэм #FAF7F2 на зялёным #1D6B4F, 6.01:1 (WCAG 1.4.11).
  Поўная заліўка без празрыстасці (патрабаванне iOS). Тэксту і компаса няма.
-->
