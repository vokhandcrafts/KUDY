  Скіца для параўнання і выбару ўладара, НЕ production-асет. Кола — «гарызонт»,
  галава выходзіць за яго ўверх; зялёная абводка аддзяляе крэм ад крэму на коле.
  Палітра — канон (visual-language.md): крэм #FAF7F2 на зялёным #1D6B4F, 6.01:1.
  Поўная заліўка без празрыстасці (патрабаванне iOS). Тэксту і компаса няма
  (кампасны варыянт — icon-i3-compass.svg).
-->
