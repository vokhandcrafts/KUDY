  Той жа склад, што icon-i3.svg; у коле дададзеныя чатыры дзелкі і цэнтр —
  намёк на компас без стрэлкі і без тэксту. Стрэлку не малюем: фіксаваны
  «напрамак» у статычным асеце раіў G25.04 не паказваць, і месца кампаса
  ў іконцы не абранае (B05, рэестр рашэнняў). Скіца для параўнання,
