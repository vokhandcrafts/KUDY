<!--
  pose-curious.svg — G25.03 (#702), поза «цікаўны/здзіўлены».
  Прапанова хвалі G25, НЕ production-асет; падабенства фігурцы не пацверджанае
  (арыгінальныя фота адсутнічаюць — гл. вынік G25.03 і G24.02 §2).
  Колеры: гліна #805039 — гіпотэза B04.1 (вымяраецца па фота), папера #FAF7F2,
  чарніла #22262B, line #D8D2C6 — канон visual-language.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Дракон у позе «цікаўны/здзіўлены»: галава ўзнятая ўгору, вока шырокае, крыло паўузнятае">
  <!-- ценю на зямлі (канон color.line) -->
  <ellipse cx="266" cy="466" rx="160" ry="12" fill="#D8D2C6"/>

  <!-- хвост: дуга ўправа, закручваецца ўгору крыху вышэй, лопатка-кончык -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="5" stroke-linejoin="round" d="
    M 340 372
    C 408 420, 466 406, 470 360
    C 472 330, 450 312, 432 322
    C 444 328, 448 342, 442 354
    C 430 376, 386 380, 338 350
    Z"/>
  <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
    M 432 322
    C 420 308, 418 292, 428 280
    C 432 292, 440 300, 452 304
    C 446 312, 439 318, 432 322
    Z"/>

  <!-- корпус -->
  <path fill="#805039" d="
    M 180 296
    C 158 350, 170 414, 232 438
    C 296 462, 352 432, 360 378
    C 366 330, 336 286, 284 270
    C 244 258, 198 266, 180 296
    Z"/>

  <!-- лінія жывата ўздоўж пярэдняга контуру -->
  <path fill="none" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" d="
    M 202 320
    C 190 356, 198 398, 232 422"/>

  <!-- задняя ступня: акруглая, тры кіпцюры наперад -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
    M 366 430
    C 370 442, 368 453, 360 458
    L 326 458
    C 332 450, 335 444, 336 438
    L 308 442
    C 315 433, 319 426, 322 417
    C 342 412, 360 416, 366 430
    Z"/>

  <!-- перадняя лапка: акруглая, тры кіпцюры наперад -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
    M 242 422
    C 246 434, 244 446, 237 452
    L 206 452
    C 212 445, 215 439, 216 433
    L 189 436
    C 196 428, 200 421, 203 413
    C 221 407, 237 411, 242 422
    Z"/>

  <!-- бліжэйшае крыло: паўузнятае, два «пальцы» над спіной -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
    M 252 284
    C 266 244, 292 206, 326 182
    C 322 202, 322 218, 326 234
    C 336 226, 346 222, 356 220
    C 350 240, 348 258, 352 276
    C 332 280, 306 288, 284 300
    C 270 296, 260 290, 252 284
    Z"/>

  <!-- шыя: выцягнутая ўгору, галава паднята -->
  <path fill="#805039" d="
    M 208 128
    C 182 176, 178 234, 198 286
    C 212 320, 238 338, 264 340
    C 258 358, 234 366, 212 358
    C 172 344, 146 302, 146 250
    C 146 208, 160 168, 186 126
    Z"/>

  <!-- галава: паднятая, морда ўлева-ўгору -->
  <path fill="#805039" d="
    M 172 70
    C 140 72, 116 94, 114 122
    C 113 140, 121 155, 135 162
    C 143 166, 152 167, 161 165
    C 166 177, 179 184, 194 180
    C 213 175, 224 159, 222 139
    C 220 108, 206 76, 172 70
    Z"/>

  <!-- грэбень: грывай назад-ўніз, заліваецца з чэрапам -->
  <path fill="#805039" d="
    M 206 94
    C 224 88, 240 94, 250 110
    C 236 110, 224 118, 216 132
    C 210 118, 208 105, 206 94
    Z"/>
  <path fill="#805039" d="
    M 220 122
    C 236 118, 250 126, 258 142
    C 244 142, 232 150, 224 164
    C 220 148, 220 134, 220 122
    Z"/>

  <!-- твар: воко шырокае, бровы ўзнятыя, рот-«о» здзіўлення -->
  <circle cx="152" cy="124" r="11" fill="#FAF7F2"/>
  <circle cx="154" cy="126" r="5.5" fill="#22262B"/>
  <path fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round" d="
    M 134 102 C 142 96, 154 95, 164 99"/>
  <circle cx="120" cy="136" r="2" fill="#FAF7F2"/>
  <circle cx="130" cy="153" r="6" fill="none" stroke="#FAF7F2" stroke-width="3"/>
</svg>
