<!--
  pose-inviting.svg — G25.03 (#702), поза «кліча».
  Прапанова хвалі G25, НЕ production-асет; падабенства фігурцы не пацверджанае
  (арыгінальныя фота адсутнічаюць — гл. вынік G25.03 і G24.02 §2).
  Колеры: гліна #805039 — гіпотэза B04.1 (вымяраецца па фота), папера #FAF7F2,
  чарніла #22262B, line #D8D2C6 — канон visual-language.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Дракон у позе «кліча»: крыло-рука выцягнутае наперад, галава паднятая, запрашальная ўсмешка">
  <!-- ценю на зямлі (канон color.line) -->
  <ellipse cx="262" cy="466" rx="160" ry="12" fill="#D8D2C6"/>

  <!-- хвост: дуга ўправа, закручваецца ўгору, лопатка-кончык -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="5" stroke-linejoin="round" d="
    M 340 376
    C 408 424, 468 412, 472 366
    C 474 336, 452 318, 434 328
    C 446 334, 450 348, 444 360
    C 432 382, 388 386, 340 356
    Z"/>
  <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
    M 434 328
    C 422 314, 420 298, 430 286
    C 434 298, 442 306, 454 310
    C 448 318, 441 324, 434 328
    Z"/>

  <!-- корпус -->
  <path fill="#805039" d="
    M 180 296
    C 158 350, 170 414, 232 438
    C 296 462, 352 432, 360 378
    C 366 330, 336 286, 284 270
    C 244 258, 198 266, 180 296
    Z"/>

  <!-- лінія жывата ўздоўж пярэдняга контуру -->
  <path fill="none" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" d="
    M 202 320
    C 190 356, 198 398, 232 422"/>

  <!-- задняя ступня: акруглая, тры кіпцюры наперад -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
    M 366 430
    C 370 442, 368 453, 360 458
    L 326 458
    C 332 450, 335 444, 336 438
    L 308 442
    C 315 433, 319 426, 322 417
    C 342 412, 360 416, 366 430
    Z"/>

  <!-- перадняя лапка: акруглая, тры кіпцюры наперад -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
    M 242 422
    C 246 434, 244 446, 237 452
    L 206 452
    C 212 445, 215 439, 216 433
    L 189 436
    C 196 428, 200 421, 203 413
    C 221 407, 237 411, 242 422
    Z"/>

  <!-- шыя: роўная, крыху наперад -->
  <path fill="#805039" d="
    M 162 136
    C 148 186, 154 242, 180 290
    C 196 316, 222 330, 248 334
    C 242 352, 218 360, 196 352
    C 158 338, 134 296, 134 244
    C 134 202, 144 166, 156 134
    Z"/>

  <!-- галава: паднятая, морда ўлева, адкрытая ўсмешка -->
  <path fill="#805039" d="
    M 150 80
    C 116 78, 90 102, 88 134
    C 87 153, 96 168, 111 176
    C 119 180, 130 182, 139 180
    C 144 193, 157 201, 172 198
    C 192 194, 204 177, 202 156
    C 200 124, 188 90, 150 80
    Z"/>

  <!-- адкрыты рот: папяровы клін на канцы морды -->
  <path fill="#FAF7F2" d="
    M 92 148
    C 100 155, 110 158, 120 156
    C 114 166, 100 168, 92 161
    Z"/>

  <!-- грэбень: грывай назад-ўніз, заліваецца з чэрапам -->
  <path fill="#805039" d="
    M 182 96
    C 202 88, 220 96, 230 116
    C 216 116, 204 124, 196 138
    C 190 122, 186 108, 182 96
    Z"/>
  <path fill="#805039" d="
    M 194 126
    C 212 122, 228 130, 236 148
    C 222 148, 210 156, 202 170
    C 198 154, 196 138, 194 126
    Z"/>

  <!-- бліжэйшае крыла: рука наперад-ўніз, разгорнутая далонню з двума «пальцамі» -->
  <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
    M 252 298
    C 210 294, 160 304, 118 316
    C 110 319, 104 322, 100 326
    C 118 344, 124 352, 130 356
    C 136 364, 141 370, 146 376
    C 176 380, 206 376, 232 362
    C 246 352, 254 336, 256 318
    Z"/>

  <!-- твар: цёплае вока, брова, запрашальная ўсмешка -->
  <circle cx="127" cy="135" r="10" fill="#FAF7F2"/>
  <circle cx="130" cy="137" r="5" fill="#22262B"/>
  <path fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round" d="
    M 108 115 C 116 109, 129 108, 139 112"/>
  <circle cx="103" cy="149" r="2.5" fill="#FAF7F2"/>
</svg>
