<!--
  dragon-silhouette.svg — G25.03 (#702), аркуш пропорцый і сілуэту.
  Аснова кіта персанажа: поўная фігурка (напрамак «крылы захоўваем», B05 адкрыта).
  Прапанова хвалі G25, НЕ production-асет. Прапорцыі ўзятыя з гэтай вектарнай
  будовы; падабенства глінянай фігурцы НЕ пацверджанае — арыгінальныя фота
  адсутнічаюць (гл. вынік G25.03, запыт уводу; крыніцы-рэференсы: A1, B2,
  кандыдаты G24.02). Колеры: гліна #805039 — гіпотэза B04.1; лініі — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-label="Аркуш пропорцый: поўны сілуэт дракона з размежаваннем вышынь — галава, шыя, корпус, зямля">
  <rect width="760" height="512" fill="#FAF7F2"/>

  <!-- загаловак і пазнака статуса -->
  <text x="24" y="36" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#22262B">Прапорцыі і сілуэт — аснова кіта персанажа</text>
  <text x="24" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">Прапанова G25.03 · падабенства не пацверджанае (фота адсутнічаюць) · крылы захоўваем — B05 адкрыта</text>

  <!-- сетка вышынь: пункцірныя лініі ўзроўняў -->
  <g stroke="#6B7280" stroke-width="1" stroke-dasharray="4 4" opacity="0.55">
    <line x1="120" y1="104" x2="560" y2="104"/>
    <line x1="120" y1="200" x2="560" y2="200"/>
    <line x1="120" y1="270" x2="560" y2="270"/>
    <line x1="120" y1="438" x2="560" y2="438"/>
    <line x1="120" y1="464" x2="560" y2="464"/>
  </g>

  <!-- меры вышыні ўлева: суадносіны сегментаў -->
  <g stroke="#6B7280" stroke-width="1.5">
    <line x1="96" y1="104" x2="96" y2="200"/>
    <line x1="92" y1="104" x2="100" y2="104"/>
    <line x1="92" y1="200" x2="100" y2="200"/>
    <line x1="96" y1="200" x2="96" y2="270"/>
    <line x1="92" y1="200" x2="100" y2="200"/>
    <line x1="92" y1="270" x2="100" y2="270"/>
    <line x1="96" y1="270" x2="96" y2="464"/>
    <line x1="92" y1="270" x2="100" y2="270"/>
    <line x1="92" y1="464" x2="100" y2="464"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#22262B">
    <text x="30" y="156">галава</text>
    <text x="30" y="172">≈ ¼ H</text>
    <text x="30" y="240">шыя</text>
    <text x="30" y="256">≈ ¼ H</text>
    <text x="30" y="360">корпус з нагамі</text>
    <text x="30" y="376">≈ ½ H</text>
  </g>

  <!-- ценю на зямлі -->
  <ellipse cx="330" cy="466" rx="160" ry="12" fill="#D8D2C6"/>

  <!-- фігурка: поза «спакойны» як базавая, зрушана ўправа -->
  <g transform="translate(68,0)">
    <!-- хвост -->
    <path fill="#805039" stroke="#FAF7F2" stroke-width="5" stroke-linejoin="round" d="
      M 340 376
      C 408 424, 468 412, 472 366
      C 474 336, 452 318, 434 328
      C 446 334, 450 348, 444 360
      C 432 382, 388 386, 340 356
      Z"/>
    <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
      M 434 328
      C 422 314, 420 298, 430 286
      C 434 298, 442 306, 454 310
      C 448 318, 441 324, 434 328
      Z"/>
    <!-- корпус -->
    <path fill="#805039" d="
      M 180 296
      C 158 350, 170 414, 232 438
      C 296 462, 352 432, 360 378
      C 366 330, 336 286, 284 270
      C 244 258, 198 266, 180 296
      Z"/>
    <path fill="none" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" d="
      M 202 320
      C 190 356, 198 398, 232 422"/>
    <!-- задняя ступня -->
    <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
      M 366 430
      C 370 442, 368 453, 360 458
      L 326 458
      C 332 450, 335 444, 336 438
      L 308 442
      C 315 433, 319 426, 322 417
      C 342 412, 360 416, 366 430
      Z"/>
    <!-- перадняя лапка -->
    <path fill="#805039" stroke="#FAF7F2" stroke-width="3.5" stroke-linejoin="round" d="
      M 242 422
      C 246 434, 244 446, 237 452
      L 206 452
      C 212 445, 215 439, 216 433
      L 189 436
      C 196 428, 200 421, 203 413
      C 221 407, 237 411, 242 422
      Z"/>
    <!-- крыла складзенае -->
    <path fill="#805039" stroke="#FAF7F2" stroke-width="4" stroke-linejoin="round" d="
      M 244 268
      C 270 250, 300 248, 326 260
      C 344 270, 354 288, 356 310
      C 358 336, 352 362, 338 382
      C 330 352, 316 322, 292 302
      C 278 290, 262 278, 244 268
      Z"/>
    <!-- шыя -->
    <path fill="#805039" d="
      M 172 146
      C 148 196, 152 250, 180 292
      C 198 318, 224 332, 250 334
      C 244 352, 220 360, 198 352
      C 158 338, 132 298, 132 246
      C 132 208, 144 174, 162 146
      Z"/>
    <!-- галава -->
    <path fill="#805039" d="
      M 150 104
      C 116 102, 90 126, 88 158
      C 87 177, 96 192, 111 200
      C 119 204, 129 206, 138 204
      C 143 217, 156 225, 172 222
      C 192 218, 204 201, 202 180
      C 200 148, 188 114, 150 104
      Z"/>
    <!-- грэбень -->
    <path fill="#805039" d="
      M 182 120
      C 202 112, 220 120, 230 140
      C 216 140, 204 148, 196 162
      C 190 146, 186 132, 182 120
      Z"/>
    <path fill="#805039" d="
      M 194 150
      C 212 146, 228 154, 236 172
      C 222 172, 210 180, 202 194
      C 198 178, 196 162, 194 150
      Z"/>
    <!-- твар -->
    <circle cx="127" cy="159" r="10" fill="#FAF7F2"/>
    <circle cx="130" cy="161" r="5" fill="#22262B"/>
    <path fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round" d="
      M 108 139 C 116 133, 129 132, 139 136"/>
    <circle cx="103" cy="173" r="2.5" fill="#FAF7F2"/>
    <path fill="none" stroke="#FAF7F2" stroke-width="3.5" stroke-linecap="round" d="
      M 95 186 C 101 191, 109 194, 117 194"/>
  </g>

  <!-- подпісы ўзроўняў справа -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">
    <text x="572" y="108">макушка (узровень 1.0 H)</text>
    <text x="572" y="204">ніз морды / аснова чэрапа</text>
    <text x="572" y="274">лінія спіны, аснова крыла</text>
    <text x="572" y="442">ніз корпуса</text>
    <text x="572" y="468">зямля (узровень 0)</text>
  </g>

  <!-- заўвага пра крылы і хвост -->
  <g font-family="system-ui, sans-serif" font-size="12.5" fill="#22262B">
    <text x="572" y="320">Крылы (разгорнутыя, па B2):</text>
    <text x="572" y="338">размах ≈ 1.4 шырыні корпуса,</text>
    <text x="572" y="356">два «пальцы» на кожным крыле.</text>
    <text x="572" y="384">Хвост: доўгая дуга, на канцы —</text>
    <text x="572" y="402">двузубая лопатка.</text>
  </g>
</svg>
