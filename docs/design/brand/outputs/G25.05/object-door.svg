<!--
  object-door.svg — G25.05 (#704), прадмет «Цень на дзверах».
  Досвед: заўважаная дэталь каля вартай увагі месца (ціхая падказка).
  Матыв — дзверы, падзеленыя касой паласой святла; ручка — адзіны
  бурштынавы акцэнт. Прапанова хвалі G25, НЕ production-асет.
  Сям'я: крэм #FAF7F2, гліна #805039 (B04.1), зялёная глазура #1D6B4F,
  бурштын #D8A551 (B04.2), line #D8D2C6 — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Цень на дзверах»: зялёныя дзверы з глінянай рамай, касая святлая паласа і бурштынавая ручка">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- дзверы: зялёная глазура з глінянай рамай -->
  <path fill="#1D6B4F" stroke="#805039" stroke-width="9" stroke-linejoin="round" d="M 162 424 L 162 216 C 162 172, 196 144, 246 144 C 296 144, 330 172, 330 216 L 330 424 Z"/>

  <!-- касая паласа святла: крэм на глазуры -->
  <path fill="#FAF7F2" d="M 330 176 L 330 260 L 186 424 L 240 424 L 330 320 Z" opacity="1"/>

  <!-- шпонкі дзвярэй: крэмавыя рыскі -->
  <line x1="272" y1="168" x2="272" y2="410" stroke="#FAF7F2" stroke-width="7"/>
  <line x1="316" y1="190" x2="316" y2="410" stroke="#FAF7F2" stroke-width="7"/>

  <!-- ручка: адзіны бурштынавы акцэнт -->
  <circle cx="238" cy="330" r="15" fill="#D8A551"/>
</svg>
