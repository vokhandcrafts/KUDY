<!--
  object-vane.svg — G25.05 (#704), прадмет «Флюгер».
  Досвед: вяртаньне ў горад / паўторная прагулка (паводзіны паўтарэння —
  адкрытае пытанне вядзення). Матыв — птушка-флюгер на шпілі; шарык-навершша —
  адзіны бурштынавы акцэнт. Прапанова хвалі G25, НЕ production-асет.
  Сям'я: крэм #FAF7F2, гліна #805039 (B04.1), зялёная глазура #1D6B4F,
  бурштын #D8A551 (B04.2), line #D8D2C6 — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Флюгер»: зялёная птушка на шпілі з глінянай стрыжнем і бурштынавым шарыкам">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- шпіль і стрыжань: гліна -->
  <path fill="#1D6B4F" d="M 214 436 L 244 224 L 268 224 L 298 436 Z"/>
  <line x1="256" y1="224" x2="256" y2="150" stroke="#805039" stroke-width="9" stroke-linecap="round"/>

  <!-- шарык-навершша: адзіны бурштынавы акцэнт -->
  <circle cx="256" cy="140" r="15" fill="#D8A551"/>

  <!-- птушка: зялёная глазура, глядзіць па ветру -->
  <path fill="#1D6B4F" d="M 250 176 C 262 158, 290 152, 310 160 C 330 168, 342 184, 340 202 L 366 214 L 338 222 C 330 236, 314 244, 296 242 L 288 258 L 276 244 C 262 240, 252 230, 250 216 L 222 226 L 244 204 C 244 194, 246 184, 250 176 Z"/>
  <!-- хвост-вярціла: гліняны клін -->
  <path fill="#805039" d="M 250 196 L 196 184 L 244 212 Z"/>
</svg>
