<!--
  object-amber.svg — G25.05 (#704), прадмет «Бурштын».
  Досвед: праслуханы Moment — тэйзер, які запрасіў у горад. Матыв —
  бурштынавы каменьчык на глазуравай вальне; сам каменьчык — адзіны
  бурштынавы акцэнт. Прапанова хвалі G25, НЕ production-асет.
  Сям'я: крэм #FAF7F2, гліна #805039 (B04.1), зялёная глазура #1D6B4F,
  бурштын #D8A551 (B04.2), line #D8D2C6 — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Бурштын»: бурштынавы каменьчык з крэмавым блікам на зялёнай хвалі">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- вальня: зялёная глазуравая дуга -->
  <path fill="none" stroke="#1D6B4F" stroke-width="20" stroke-linecap="round" d="M 140 320 C 170 280, 200 268, 232 288 C 264 308, 300 312, 336 292 C 356 281, 370 280, 380 286"/>

  <!-- каменьчык: адзіны бурштынавы акцэнт -->
  <path fill="#D8A551" stroke="#805039" stroke-width="6" stroke-linejoin="round" d="M 216 176 C 240 152, 292 152, 312 184 C 330 214, 316 258, 280 268 C 240 278, 204 250, 204 218 C 204 202, 208 188, 216 176 Z"/>
  <!-- блік: крэмавая рыска -->
  <path fill="#FAF7F2" d="M 252 180 C 264 170, 282 172, 290 182 C 280 186, 262 188, 252 180 Z"/>
</svg>
