<!--
  object-reflection.svg — G25.05 (#704), прадмет «Адлюстраванне».
  Пробны прадмет з брыфа «Атлас знаходак» v1 (a11ea86): крэмавы керамічны
  медальён, тры хвалі з зялёнай глазурай, адзін бурштынавы акцэнт.
  Прапанова хвалі G25, НЕ production-асет. Колеры: крэм #FAF7F2, гліна #805039
  (гіпотэза B04.1), зялёны #1D6B4F — канон, бурштын #D8A551 (гіпотэза B04.2),
  line #D8D2C6 — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Адлюстраванне»: крэмавы керамічны круг з пятлёй, тры зялёныя хвалі і адна бурштынавая кропка-сонца">
  <!-- ценю на паліцы (канон color.line) -->
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>

  <!-- керамічная пятля -->
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>

  <!-- корпус: крэмавая кераміка з гліняным контурам -->
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <!-- унутраны абадок глазуравай кромкі -->
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- бурштынавы акцэнт: сонца-кропка над вадой -->
  <circle cx="300" cy="196" r="20" fill="#D8A551"/>

  <!-- тры хвалі з зялёнай глазурай -->
  <path fill="none" stroke="#1D6B4F" stroke-width="22" stroke-linecap="round" d="M 138 250 C 168 232, 196 232, 226 250 C 256 268, 284 268, 314 250 C 336 237, 356 236, 374 246"/>
  <path fill="none" stroke="#1D6B4F" stroke-width="22" stroke-linecap="round" d="M 138 310 C 168 292, 196 292, 226 310 C 256 328, 284 328, 314 310 C 336 297, 356 296, 374 306"/>
  <path fill="none" stroke="#1D6B4F" stroke-width="22" stroke-linecap="round" d="M 156 368 C 184 352, 210 352, 238 368 C 266 384, 292 384, 320 368 C 340 357, 356 356, 370 363"/>
</svg>
