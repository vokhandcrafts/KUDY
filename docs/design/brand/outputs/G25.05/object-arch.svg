<!--
  object-arch.svg — G25.05 (#704), прадмет «Пад аркай».
  Досвед: пачутая гісторыя на месцы (аўдыё эпізод кропкі). Матыв — арка і
  лесвіца крокаў, фонарык у зеніце аркі — адзіны бурштынавы акцэнт.
  Прапанова хвалі G25, НЕ production-асет. Сям'я: крэм #FAF7F2, гліна #805039
  (B04.1), зялёная глазура #1D6B4F — канон, бурштын #D8A551 (B04.2).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Пад аркай»: зялёная глазураваная арка з лесвіцай крокаў і бурштынавым фонарыкам">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- арка: тоўстая зялёная глазура -->
  <path fill="none" stroke="#1D6B4F" stroke-width="26" stroke-linecap="round" d="M 136 396 L 136 250 C 136 176, 192 132, 256 132 C 320 132, 376 176, 376 250 L 376 396"/>

  <!-- лесвіца крокаў: чатыры зялёныя прыступкі -->
  <rect x="196" y="330" width="120" height="26" fill="#1D6B4F"/>
  <rect x="180" y="362" width="152" height="26" fill="#1D6B4F"/>
  <rect x="164" y="394" width="184" height="24" fill="#1D6B4F"/>

  <!-- фонарык: бурштынавая кропка на гліняным падвесе -->
  <line x1="256" y1="164" x2="256" y2="206" stroke="#805039" stroke-width="7"/>
  <circle cx="256" cy="222" r="17" fill="#D8A551"/>
</svg>
