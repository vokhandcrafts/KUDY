<!--
  object-crane.svg — G25.05 (#704), прадмет «Жураў» (гданьскі марскі жураў).
  Досвед: аўтарская гісторыя месца (вялікая форма на кропцы). Матыв — вежа
  з дзвюма кранаўымі бэлькамі і паднятым грузам; груз — адзіны бурштынавы
  акцэнт. Прапанова хвалі G25, НЕ production-асет.
  Сям'я: крэм #FAF7F2, гліна #805039 (B04.1), зялёная глазура #1D6B4F,
  бурштын #D8A551 (B04.2), line #D8D2C6 — канон.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён «Жураў»: зялёная вежа з гліняным дахам і дзвюма бэлькамі, на канатах — бурштынавы груз">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="11"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5"/>

  <!-- вежа: звужаны корпус з зялёнай глазуры -->
  <path fill="#1D6B4F" d="M 190 420 L 196 208 L 268 208 L 274 420 Z"/>
  <!-- гліняны шчытковы дах -->
  <path fill="#805039" d="M 184 214 L 232 150 L 280 214 Z"/>

  <!-- прамяні-бэлькі ўправа: дзве, на рознай вышыні -->
  <rect x="266" y="222" width="96" height="16" fill="#805039"/>
  <rect x="266" y="270" width="72" height="14" fill="#805039"/>

  <!-- канат і груз: адзіны бурштынавы акцэнт -->
  <line x1="356" y1="238" x2="356" y2="300" stroke="#805039" stroke-width="6"/>
  <rect x="340" y="300" width="32" height="26" fill="#D8A551"/>

  <!-- вода: кароткая хваля ля асновы -->
  <path fill="none" stroke="#1D6B4F" stroke-width="14" stroke-linecap="round" d="M 158 442 C 186 428, 210 428, 238 442 C 266 456, 290 456, 318 442 C 334 434, 348 432, 360 438"/>

  <!-- вокны-слоты: крэм -->
  <rect x="216" y="240" width="16" height="34" fill="#FAF7F2"/>
  <rect x="216" y="300" width="16" height="34" fill="#FAF7F2"/>
  <rect x="216" y="360" width="16" height="34" fill="#FAF7F2"/>
</svg>
