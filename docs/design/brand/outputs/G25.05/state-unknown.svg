<!--
  state-unknown.svg — G25.05 (#704), стан «невядомае / неправеранае».
  Прадмет, пра які сістэма не ведае, ці выконваецца ўмова: пункцірны абадок,
  знак пытання ў цэнтры, матыву няма. Тэкст-стан не з'яўляецца ні сувенірам,
  ні дасягненнем (гл. вынік G25.05 §станы). Прапанова хвалі G25.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Медальён з пункцірным абадком і знакам пытання: невядома, ці адносіцца прадмет да калекцыі">
  <ellipse cx="256" cy="478" rx="140" ry="10" fill="#D8D2C6"/>
  <circle cx="256" cy="74" r="24" fill="none" stroke="#805039" stroke-width="12"/>
  <circle cx="256" cy="282" r="192" fill="#FAF7F2" stroke="#805039" stroke-width="9" stroke-dasharray="22 16"/>
  <circle cx="256" cy="282" r="168" fill="none" stroke="#D8D2C6" stroke-width="5" stroke-dasharray="6 14"/>

  <!-- знак пытання: гліна -->
  <path fill="none" stroke="#805039" stroke-width="20" stroke-linecap="round" d="M 216 226 C 216 186, 296 184, 296 230 C 296 262, 256 264, 256 296"/>
  <circle cx="256" cy="348" r="15" fill="#805039"/>
</svg>
