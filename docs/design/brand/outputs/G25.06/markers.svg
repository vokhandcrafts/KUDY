<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Маркеры кропак KUDY: зачынена, гучыць, праслухана, даступна, чакае, кропка пазіцыі, POI">
  <!-- G25.06 (#705): вектарны экспарт спецімена маркераў.
       Залівкі і памеры — даслоўна канон G06.07 (docs/design/visual-language.md, «Дадатак»):
       marker.* 34px, белы абвод 2px, цень; person 18px, абвод 3px; POI 14px badge-mixed.
       Літара стану — канон §5 (у кодзе сёння без літары — handoff H3). -->
  <style>
    text{font-family:'Golos Text',system-ui,sans-serif}
    .lbl{font-size:13px;fill:#22262b}
    .tok{font-size:10px;fill:#6b7280;font-family:ui-monospace,monospace}
    .cap{font-size:12px;fill:#4c5359}
  </style>
  <rect x="16" y="16" width="1168" height="188" rx="10" fill="#faf7f2" stroke="#c9c1b1"/>
  <g font-weight="600">
    <!-- зачынена -->
    <g transform="translate(70,60)">
      <circle r="17" fill="#67707a" stroke="#ffffff" stroke-width="2"/>
      <circle r="17" fill="none" stroke="#22262b" stroke-opacity="0.25" stroke-width="1" transform="translate(0,1)"/>
      <text y="5" text-anchor="middle" font-size="15" fill="#ffffff">З</text>
      <text y="52" text-anchor="middle" class="lbl">зачынена</text>
      <text y="66" text-anchor="middle" class="tok">color.marker.locked</text>
    </g>
    <!-- гучыць -->
    <g transform="translate(230,60)">
      <circle r="17" fill="#b3331f" stroke="#ffffff" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="15" fill="#ffffff">Г</text>
      <text y="52" text-anchor="middle" class="lbl">гучыць</text>
      <text y="66" text-anchor="middle" class="tok">color.marker.playing</text>
    </g>
    <!-- праслухана -->
    <g transform="translate(390,60)">
      <circle r="17" fill="#1d6b4f" stroke="#ffffff" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="15" fill="#ffffff">П</text>
      <text y="52" text-anchor="middle" class="lbl">праслухана</text>
      <text y="66" text-anchor="middle" class="tok">color.marker.played</text>
    </g>
    <!-- даступна -->
    <g transform="translate(550,60)">
      <circle r="17" fill="#8a610e" stroke="#ffffff" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="15" fill="#ffffff">Д</text>
      <text y="52" text-anchor="middle" class="lbl">даступна</text>
      <text y="66" text-anchor="middle" class="tok">color.marker.available</text>
    </g>
    <!-- чакае -->
    <g transform="translate(710,60)">
      <circle r="17" fill="#646c77" stroke="#ffffff" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="15" fill="#ffffff">Ч</text>
      <text y="52" text-anchor="middle" class="lbl">чакае</text>
      <text y="66" text-anchor="middle" class="tok">color.marker.pending</text>
    </g>
    <!-- кропка пазіцыі -->
    <g transform="translate(870,60)">
      <circle r="9" fill="#1f5aa8" stroke="#ffffff" stroke-width="3"/>
      <text y="52" text-anchor="middle" class="lbl">пазіцыя 18px</text>
      <text y="66" text-anchor="middle" class="tok">color.person · без станаў</text>
    </g>
    <!-- POI -->
    <g transform="translate(1010,60)">
      <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#ece7f8" stroke="#6b7280"/>
      <text y="52" text-anchor="middle" class="lbl">POI 14px</text>
      <text y="66" text-anchor="middle" class="tok">badge-mixed + muted (H7)</text>
    </g>
  </g>
  <text x="70" y="186" class="cap">Кропка 34px, белы абвод 2px, цень; літара — канон §5 (код сёння малюе кропку без літары — handoff H3). Стан чытаецца не толькі колерам: «{назва} — {стан}» + aria-label.</text>
</svg>
