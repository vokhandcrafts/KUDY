<!--
  kudy-compass-mock.svg — G25.04 (#703), мок роля В: «рэальны паказчык напрамку».
  Гэта МАКЕТ для статычных прататыпаў і дызайн-дошак: вугал стрэлкі фіксаваны рукамі
  (30° ад поўначы), ніякага сэнсара за ім не стаіць. Працуючы напрамак у статычным
  прататыпе не паказваецца (картачка G25.04, крытэрый 3). У прадукт не ўваходзіць;
  сэнсарная логіка — па-за абсягам задачы. Сакрэтныя кропкі па кампасе — B10, адкладзена.
  Кампас у брыфе — «магчымая асабістая рэч героя»; форма і месца ў іконцы не абраныя
  (B05, уладальнік #693). Гэты мок — не брэнд-асет і не лаўнчар-іконка.
  Кастомнае імя з прэфіксам kudy- паводле чэкліста нэймінгу G25.04.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="макет: напрамак зададзены рукамі, не сэнсарам">
  <!-- корпус: папяровая пара, круг канона -->
  <circle cx="120" cy="120" r="104" fill="#faf7f2" stroke="#d8d2c6" stroke-width="4"/>
  <!-- румбы-крэсцікі (дэкор, не даныя) -->
  <g stroke="#d8d2c6" stroke-width="2" stroke-linecap="round">
    <path d="M120 26v14"/><path d="M120 200v14"/><path d="M26 120h14"/><path d="M200 120h14"/>
  </g>
  <!-- пазнака поўначы: Пн (поўнач); іншыя румбы ў моку не пазначаем -->
  <text x="120" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#22262b">Пн</text>
  <!-- стрэлка: ФІКСАВАНЫ вугал 30°, намаляваны рукамі -->
  <g transform="rotate(30 120 120)">
    <path d="M120 52 L132 120 L120 132 L108 120 Z" fill="#1f5aa8"/>
    <path d="M120 188 L132 120 L120 132 L108 120 Z" fill="#d8d2c6"/>
  </g>
  <circle cx="120" cy="120" r="7" fill="#faf7f2" stroke="#1f5aa8" stroke-width="3"/>
  <!-- яўная пазнака моку: працуючай стрэлкі за гэтым не стаіць -->
  <text x="120" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">МАКЕТ — напрамак зададзены рукамі</text>
</svg>
