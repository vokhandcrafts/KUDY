<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 330" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Дракон і чалавек ідуць да гарызонту</title>
  <desc id="desc">Каліграфічны чарнільны эскіз: са спіны бачны дракон з хвастом злева і чалавек побач. Яны ідуць па гданьскай вуліцы да цэнтра перспектывы паміж камяніцамі.</desc>
